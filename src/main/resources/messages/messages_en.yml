prefix: "&#FFA7A7ᴍ&#FF8080ᴋ&#FF5858ᴀ&#FF3131ᴄ &8\u00BB"

alerts-enabled: "<prefix> &fAlerts enabled."
alerts-disabled: "<prefix> &fAlerts disabled."
alerts-format: "<prefix> &f<player> &cfailed &f<check_name> &f(x&c<vl>&f) &7<verbose>"

player-not-found: "<prefix> &cPlayer is exempt or offline!"
run-as-player: "<prefix> &cThis command can only be used by players!"
reload-start: "<prefix> &eReloading MKAC configuration..."
reload-success: "<prefix> &aMKAC configuration reloaded."

prob:
  enabled: "&aProbability display for <player> enabled."
  disabled: "&eProbability display for <player> disabled."
  no-data: "&cCould not get data for <player>."
  no-aicheck: "&cAI-Check is not active for <player>."
  format:
    label-prob: "Prob"
    label-buffer: "Buffer"
    label-ping: "Ping"
    separator: " | "
    suffix-ping: "ms"

falsepositive:
  success: "<prefix> &aTicks saved to restored_data/<player>_<date>.csv"
  fail: "<prefix> &cFailed to save data"
  no-data: "<prefix> &cNo data to save"

cross-server:
  alert-prefix: "&8[&6<server>&8]"

brand:
  alerts-enabled: "<prefix> &fBrand notifications enabled."
  alerts-disabled: "<prefix> &fBrand notifications disabled."
  notification: "<prefix> &f<player> &7joined using &c<brand>"
  disconnect-forge: "&cYour Forge version is blacklisted due to a built-in reach exploit.\n&eAffected versions: 1.18.2-1.19.3\n&7Please update Forge or use a different client."

profile:
  no-data: "<prefix> &cCould not get data (exempt or offline)."
  lines:
    - "&7======================"
    - "<prefix> &cProfile for &f<player>"
    - "&cPing: &f<ping>"
    - "&cVersion: &f<version>"
    - "&cClient Brand: &f<brand>"
    - "&cSession Time: &f<session_time>"
    - "&cTotal Playtime: &f<total_playtime>"
    - "&cHorizontal Sensitivity: &f<sens_x>"
    - "&cVertical Sensitivity: &f<sens_y>"
    - "&cAI Buffer: &f<ai_buffer>"
    - "&cPredictions >0.9: &f<ai_probs_90>"
    - "&7======================"

history:
  disabled: "<prefix> &cHistory subsystem is disabled!"
  header: "<prefix> &cShowing logs for &f<player> &f(&f<page>&f/&f<max_pages>&f)"
  entry: "<prefix> &8[&f<server>&8] &cFailed <check> &f(x&c<vl>&f) &7<verbose> &f(&c<timeago>&f)"
  no-violations: "<prefix> &7No violations found for this player."

logs:
  header: "<prefix> &cShowing all logs &f(&f<page>&f/&f<max_pages>&f)"
  entry: "<prefix> &8[&f<server>&8] &f<player> &cfailed <check> &f(x&c<vl>&f) &7<verbose> &f(&c<timeago>&f)"
  no-violations: "<prefix> &7No violations found."
  invalid-time: "<prefix> &cInvalid time format. Use like --time 15m/15h/15d."

punish:
  reset-success: "<prefix> &aAll violation levels (VL) for player <player> have been reset."

suspicious:
  alerts-enabled: "<prefix> &aSuspicious player alerts enabled."
  alerts-disabled: "<prefix> &eSuspicious player alerts disabled."
  alert-triggered: "<prefix> Player &f<player> &fis suspicious (Buffer: &c<buffer>&f)."
  list-empty: "<prefix> &7No suspicious players online."
  list-header: "<prefix> &7List of suspicious players (&c<count>&7):"
  list-entry: " &7- &f<player> &8| &7Buffer: &c<buffer>&7, Ping: &c<ping>ms"
  top-none: "<prefix> &7No highly suspicious players at the moment."
  top-player: "<prefix> &7Top suspicious: &c<player> &7(Buffer: &c<buffer>&7)."

stats:
  lines:
    - "&7================== &#FFA7A7ᴍ&#FF8080ᴋ&#FF5858ᴀ&#FF3131ᴄ &cStatistics &7=================="
    - "&cTotal Flags (24h): &f<flags_24h>"
    - "&cUnique Violators (24h): &f<violators_24h>"
    - "&cPlayers Online: &f<online_players>"
    - "&cCurrently Suspicious: &f<suspicious_now>"
    - "&7==============================================="

help:
  - "&7================== &cMKAC Help &7=================="
  - "&c/<command> alerts &7- &fToggle violation alerts."
  - "&c/<command> brands &7- &fToggle client brand notifications."
  - "&c/<command> profile <player> &7- &fView a player's profile."
  - "&c/<command> prob <player> &7- &fLive view AI probabilities for a player."
  - "&c/<command> reload &7- &fReload the configuration."
  - "&c/<command> history <player> [page] &7- &fView a player's violation history."
  - "&c/<command> menu &7- &fOpen kyriatnik."
  - "&c/<command> status &7- &fEnable hologram on players."
  - "&c/<command> punish reset <player> &7- &fReset all of a player's violation levels."
  - "&c/<command> help &7- &fView this help message."
  - "&7==============================================="

internal:
  error: "&cAn error occurred whilst processing packets."

time:
  ago: " ago"
  days: "d"
  hours: "h"
  minutes: "m"
  seconds: "s"