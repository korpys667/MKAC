prefix: "&#FFA7A7ᴍ&#FF8080ᴋ&#FF5858ᴀ&#FF3131ᴄ &8\u00BB"

alerts-enabled: "<prefix> &fОповещения включены."
alerts-disabled: "<prefix> &fОповещения выключены."
alerts-format: "<prefix> &f<player> &cпровалил &f<check_name> &f(x&c<vl>&f) &7<verbose>"

player-not-found: "<prefix> &cИгрок исключен или находится вне сети!"
run-as-player: "<prefix> &cЭту команду могут использовать только игроки!"
reload-start: "<prefix> &eПерезагрузка конфигурации MKAC..."
reload-success: "<prefix> &aКонфигурация MKAC перезагружена."

prob:
  enabled: "&aОтображение вероятностей для <player> включено."
  disabled: "&eОтображение вероятностей для <player> выключено."
  no-data: "&cНе удалось получить данные для <player>."
  no-aicheck: "&cAI-Чек неактивен для <player>."
  format:
    label-prob: "Вер-ть"
    label-buffer: "Буфер"
    label-ping: "Пинг"
    separator: " | "
    suffix-ping: "мс"

falsepositive:
  success: "<prefix> &aТики сохранены в restored_data/<player>_<дата>.csv"
  fail: "<prefix> &cНе удалось сохранить данные"
  no-data: "<prefix> &cНет данных для сохранения"

cross-server:
  alert-prefix: "&8[&6<server>&8]"

brand:
  alerts-enabled: "<prefix> &fОповещения о клиентах включены."
  alerts-disabled: "<prefix> &fОповещения о клиентах выключены."
  notification: "<prefix> &f<player> &7присоединился, используя &c<brand>"
  disconnect-forge: "&cВаша версия Forge в черном списке из-за встроенного эксплоита на дистанцию атаки.\n&eЗатронутые версии: 1.18.2-1.19.3\n&7Пожалуйста, обновите Forge или используйте другой клиент."

profile:
  no-data: "<prefix> &cНе удалось получить данные (исключён или оффлайн)."
  lines:
    - "&7======================"
    - "<prefix> &cПрофиль игрока &f<player>"
    - "&cПинг: &f<ping>"
    - "&cВерсия: &f<version>"
    - "&cКлиент: &f<brand>"
    - "&cВремя сессии: &f<session_time>"
    - "&cОбщее время игры: &f<total_playtime>"
    - "&cГоризонтальная чувствительность: &f<sens_x>"
    - "&cВертикальная чувствительность: &f<sens_y>"
    - "&cAI буфер: &f<ai_buffer>"
    - "&cПредсказаний >0.9: &f<ai_probs_90>"
    - "&7======================"

history:
  disabled: "<prefix> &cПодсистема истории отключена!"
  header: "<prefix> &cПоказ журналов для &f<player> &f(&f<page>&f/&f<max_pages>&f)"
  entry: "<prefix> &8[&f<server>&8] &cПровалено <check> &f(x&c<vl>&f) &7<verbose> &f(&c<timeago>&f)"
  no-violations: "<prefix> &7Для этого игрока не найдено нарушений."

logs:
  header: "<prefix> &cПоказаны все логи &f(&f<page>&f/&f<max_pages>&f)"
  entry: "<prefix> &8[&f<server>&8] &f<player> &cпровалил <check> &f(x&c<vl>&f) &7<verbose> &f(&c<timeago>&f)"
  no-violations: "<prefix> &7Нарушения не найдены."
  invalid-time: "<prefix> &cНеверный формат времени. Используйте --time 15m/15h/15d."

punish:
  reset-success: "<prefix> &aВсе уровни нарушений (VL) для игрока <player> были сброшены."

suspicious:
  alerts-enabled: "<prefix> &aОповещения о подозрительных игроках включены."
  alerts-disabled: "<prefix> &eОповещения о подозрительных игроках выключены."
  alert-triggered: "<prefix> Игрок &f<player> &fподозрителен (Буфер: &c<buffer>&f)."
  list-empty: "<prefix> &7Подозрительных игроков онлайн нет."
  list-header: "<prefix> &7Список подозрительных игроков (&c<count>&7):"
  list-entry: " &7- &f<player> &8| &7Буфер: &c<buffer>&7, Пинг: &c<ping>ms"
  top-none: "<prefix> &7В данный момент нет явно подозрительных игроков."
  top-player: "<prefix> &7Самый подозрительный: &c<player> &7(Буфер: &c<buffer>&7)."

stats:
  lines:
    - "&7================== &cСтатистика &7=================="
    - "&cВсего флагов (24ч): &f<flags_24h>"
    - "&cУникальных нарушителей (24ч): &f<violators_24h>"
    - "&cИгроков онлайн: &f<online_players>"
    - "&cСейчас подозрительных: &f<suspicious_now>"
    - "&7==============================================="

help:
  - "&7================== &#FFA7A7ᴍ&#FF8080ᴋ&#FF5858ᴀ&#FF3131ᴄ &cпомощь &7=================="
  - "&c/<command> alerts &7- &fВключить/выключить оповещения о нарушениях."
  - "&c/<command> brands &7- &fВключить/выключить оповещения о клиенте игрока."
  - "&c/<command> profile <player> &7- &fПросмотреть профиль игрока."
  - "&c/<command> prob <player> &7- &fПросмотр вероятностей ИИ для игрока в реальном времени."
  - "&c/<command> reload &7- &fПерезагрузить конфигурацию."
  - "&c/<command> history <player> [page] &7- &fПросмотреть историю нарушений игрока."
  - "&c/<command> menu &7- &fОткрывает курятник."
  - "&c/<command> status &7- &fВключает голограмму над игроками."
  - "&c/<command> punish reset <player> &7- &fСбросить все уровни нарушений игрока."
  - "&c/<command> help &7- &fПоказать это справочное сообщение."
  - "&7==============================================="

internal:
  error: "&cПроизошла ошибка при обработке пакетов."

time:
  ago: " назад"
  days: "д"
  hours: "ч"
  minutes: "м"
  seconds: "с"